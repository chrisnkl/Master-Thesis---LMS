server.port=8081

spring.application.name=lms-auth-server
spring.main.banner-mode=off
logging.pattern.console=%clr([%d{yyyy-MM-dd HH:mm:ss.SSS}]){yellow} %clr([%thread]){cyan} %clr(%-5level){highlight} %clr(%logger{36}){bold,blue} - %msg%n

debug=true
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=TRACE


spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.url=jdbc:postgresql://${AUTH_DB_HOST:localhost}:${AUTH_DB_PORT:5432}/${AUTH_DB_NAME:lms-auth-db}
spring.datasource.username=${AUTH_DB_USERNAME:lms-auth-user}
spring.datasource.password=${AUTH_DB_PASSWORD:lms-auth-password}

spring.security.oauth2.client.registration.microsoft.provider=${MICROSOFT_CLIENT_PROVIDER:microsoft}
spring.security.oauth2.client.registration.microsoft.client-id=${MICROSOFT_CLIENT_ID:}
spring.security.oauth2.client.registration.microsoft.client-secret=${MICROSOFT_CLIENT_SECRET:}
spring.security.oauth2.client.registration.microsoft.scope=${MICROSOFT_CLIENT_SCOPE:openid,profile,email}
spring.security.oauth2.client.registration.microsoft.authorization-grant-type=${MICROSOFT_CLIENT_AUTHORIZATION_GRANT_TYPE:authorization_code}
spring.security.oauth2.client.registration.microsoft.redirect-uri=${MICROSOFT_CLIENT_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
spring.security.oauth2.client.provider.microsoft.issuer-uri=${MICROSOFT_CLIENT_ISSUER_URI:https://login.microsoftonline.com/${MICROSOFT_TENANT_ID:}/v2.0}

setup.bootstrap.token=${SETUP_BOOTSTRAP_TOKEN:}