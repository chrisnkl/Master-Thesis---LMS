server.port=9000

spring.application.name=lms-auth-server
spring.main.banner-mode=off
logging.pattern.console=%clr([%d{yyyy-MM-dd HH:mm:ss.SSS}]){yellow} %clr([%thread]){cyan} %clr(%-5level){highlight} %clr(%logger{36}){bold,blue} - %msg%n

debug=true
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=TRACE


spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.url=jdbc:postgresql://${AUTH_DB_HOST:localhost}:${AUTH_DB_PORT:5432}/${AUTH_DB_NAME:lms-auth-db}
spring.datasource.username=${AUTH_DB_USERNAME:lms-auth-user}
spring.datasource.password=${AUTH_DB_PASSWORD:lms-auth-password}