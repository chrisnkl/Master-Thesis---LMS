<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .login-container {
            width: 360px;
            padding: 32px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        .login-button {
            background: #222;
            color: white;
        }

        .microsoft-button {
            margin-top: 12px;
            background: #f3f3f3;
            color: #222;
            border: 1px solid #ccc;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
            color: #888;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #ddd;
        }
    </style>
</head>

<body>

<div class="login-container">

    <h1>Sign in</h1>

    <form method="post" action="/login">

        <div class="form-group">
            <label for="username">Username</label>
            <input
                    id="username"
                    name="username"
                    type="text"
                    required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input
                    id="password"
                    name="password"
                    type="password"
                    required>
        </div>

        <button class="login-button" type="submit">
            Sign in
        </button>

    </form>

    <div class="divider">
        OR
    </div>

    <a href="/oauth2/authorization/microsoft">
        <button class="microsoft-button" type="button">
            Continue with Microsoft
        </button>
    </a>

</div>

</body>
</html>
