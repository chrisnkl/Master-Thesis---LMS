spring.application.name=lms-auth-server
spring.main.banner-mode=off
logging.pattern.console=%clr([%d{yyyy-MM-dd HH:mm:ss.SSS}]){yellow} %clr([%thread]){cyan} %clr(%-5level){highlight} %clr(%logger{36}){bold,blue} - %msg%n

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.url=jdbc:postgresql://${AUTH_DB_HOST:}:${AUTH_DB_PORT:}/${AUTH_DB_NAME:}
spring.datasource.username=${AUTH_DB_USERNAME:}
spring.datasource.password=${AUTH_DB_PASSWORD:}