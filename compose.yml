services:

  lms-auth-db:
    image: postgres:18
    container_name: lms-auth-db
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - "lms-auth-db-data:/var/lib/postgresql"
    environment:
      POSTGRES_DB: lms-auth-db
      POSTGRES_USER: lms-auth-user
      POSTGRES_PASSWORD: lms-auth-password

  sonarqube:
    image: sonarqube:26.11.0.134175-community
    container_name: sonarqube
    ports:
      - "9000:9000"
    restart: unless-stopped
    volumes:
      - "sonarqube-data:/opt/sonarqube/data"

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - "redis_data:/data"

volumes:
  lms-auth-db-data:
  sonarqube-data:
  redis_data: